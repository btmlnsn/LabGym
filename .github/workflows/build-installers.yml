name: installer-builder
on:
  push:
    branches: [ ci/pyinstaller-demo ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14      # Apple Silicon arm64
            target: macos
            arch: arm64
          - os: macos-13      # Intel x86_64
            target: macos
            arch: x86_64
          - os: windows-latest
            target: windows
            arch: x86_64

    runs-on: ${{ matrix.os }}
    env:
      PYTHON_VERSION: "3.10"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Clean dist/build
        shell: bash
        run: |
          rm -rf dist build || true

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements-build.txt
          pip install pyinstaller-hooks-contrib
          pip install -e .

      # ===== macOS =====
      - name: Build macOS app (spec)
        if: ${{ matrix.target == 'macos' }}
        shell: bash
        run: |
          set -euo pipefail
          "${{ env.pythonLocation }}/python" -m PyInstaller --clean --noconfirm LabGym/pyinstaller/labgym-macos.spec

      - name: Verify sidecar & detectron2 (macOS)
        if: ${{ matrix.target == 'macos' }}
        shell: bash
        run: |
          set -euo pipefail
          SIDECAR="${GITHUB_WORKSPACE}/dist/LabGym_sidecar"
          [[ -d "$SIDECAR" ]] || { echo "Expected $SIDECAR"; exit 1; }
          BASE="$SIDECAR"; [[ -d "$SIDECAR/_internal" ]] && BASE="$SIDECAR/_internal"
          [[ -f "$BASE/LabGym/detectron2/modeling/box_regression.py" ]] || { find "$SIDECAR" -maxdepth 6 -print; exit 1; }
          echo "OK: detectron2 files present"

      - name: Bundle sidecar into .app (Resources)
        if: ${{ matrix.target == 'macos' }}
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/LabGym.app"
          SIDECAR="dist/LabGym_sidecar"
          DEST="${APP}/Contents/Resources/LabGym_sidecar"
          mkdir -p "${APP}/Contents/Resources"
          rm -rf "$DEST"
          mv "$SIDECAR" "$DEST"

      - name: Ensure app icon (ICNS) is present & referenced
        if: ${{ matrix.target == 'macos' }}
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/LabGym.app"
          RES="$APP/Contents/Resources"
          PL="$APP/Contents/Info.plist"
          ICNS="labgym.icns"
          SRC="LabGym/assets/icons/$ICNS"
          [[ -f "$SRC" ]] || { echo "Missing $SRC"; exit 1; }
          mkdir -p "$RES"; cp -f "$SRC" "$RES/$ICNS"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIconFile $ICNS" "$PL" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleIconFile string $ICNS" "$PL"

      - name: Ad-hoc codesign (macOS)
        if: ${{ matrix.target == 'macos' }}
        shell: bash
        run: |
          set -euo pipefail
          codesign --deep --force --sign - "dist/LabGym.app"
          codesign --verify --deep --strict --verbose=2 "dist/LabGym.app"

      - name: Create DMG
        if: ${{ matrix.target == 'macos' }}
        shell: bash
        run: |
          set -euo pipefail
          brew install create-dmg

          VOLNAME="LabGym Installer"
          DMG="dist/LabGym-Installer-${{ matrix.arch }}.dmg"
          STAGING="dist/InstallerRoot"

          # Clean staging & previous outputs (incl. create-dmg temp files)
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          cp -R dist/LabGym.app "$STAGING/"
          rm -f "$DMG" dist/rw.*.dmg dist/*.DS_Store || true

          # More aggressive cleanup of any mounted volumes
          set +e
          # Kill any lingering hdiutil processes first
          pkill -f hdiutil || true
          sleep 1
          
          # Detach all dmg-related volumes
          for M in $(/usr/sbin/diskutil list | awk '/dmg\./{print $NF}'); do
            [[ -d "/Volumes/$M" ]] && hdiutil detach -force "/Volumes/$M" 2>/dev/null || true
          done
          [[ -d "/Volumes/$VOLNAME" ]] && hdiutil detach -force "/Volumes/$VOLNAME" 2>/dev/null || true
          
          # Also clean up any temp files that might be causing issues
          rm -rf /tmp/create-dmg* || true
          rm -rf /tmp/dmg.* || true
          set -e

          # Optional background args
          declare -a BG_ARGS=()
          [[ -n "${DMG_BG_IMAGE:-}" ]] && BG_ARGS+=(--background "$DMG_BG_IMAGE")
          [[ -n "${DMG_BG_COLOR:-}" ]] && BG_ARGS+=(--background-color "$DMG_BG_COLOR")

          # Retry create-dmg up to 3 times (DiskArbitration can be flaky)
          n=0
          until create-dmg \
            --volname "$VOLNAME" \
            --window-size 800 540 \
            --icon-size 96 \
            --app-drop-link 650 380 \
            --icon "LabGym.app" 150 380 \
            ${BG_ARGS+"${BG_ARGS[@]}"} \
            "$DMG" "$STAGING"; do
            n=$((n+1))
            if [[ $n -ge 3 ]]; then
              echo "create-dmg failed after $n attempts"; exit 1
            fi
            echo "create-dmg failed (attempt $n). Cleaning up mounts and retrying..."
            # More aggressive cleanup on retry
            set +e
            pkill -f hdiutil || true
            sleep 2
            for M in $(/usr/sbin/diskutil list | awk '/dmg\./{print $NF}'); do
              [[ -d "/Volumes/$M" ]] && hdiutil detach -force "/Volumes/$M" 2>/dev/null || true
            done
            [[ -d "/Volumes/$VOLNAME" ]] && hdiutil detach -force "/Volumes/$VOLNAME" 2>/dev/null || true
            rm -f dist/rw.*.dmg || true
            rm -rf /tmp/create-dmg* || true
            rm -rf /tmp/dmg.* || true
            sleep 2
            set -e
          done

      # ===== Windows =====
      - name: Ensure .ico exists (convert if needed)
        if: ${{ matrix.target == 'windows' }}
        shell: pwsh
        run: |
          $ico = "LabGym/assets/icons/labgym.ico"
          if (-not (Test-Path $ico)) {
            choco install imagemagick --no-progress -y
            $png = "LabGym/assets/icons/labgym.png"
            if (-not (Test-Path $png)) { Write-Error "Missing $png and no .ico"; exit 1 }
            magick convert $png -define icon:auto-resize=256,128,64,48,32,16 $ico
          }

      - name: Build Windows app (spec)
        if: ${{ matrix.target == 'windows' }}
        shell: bash
        run: |
          set -euo pipefail
          "${{ env.pythonLocation }}/python" -m PyInstaller --clean --noconfirm LabGym/pyinstaller/labgym-windows.spec
          # show what we built
          ls -la dist || true
          ls -la dist/LabGym || true

      - name: Install Inno Setup
        if: ${{ matrix.target == 'windows' }}
        run: |
          choco install innosetup --no-progress -y
          echo "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    

      - name: Create Windows installer (Inno Setup)
        if: ${{ matrix.target == 'windows' }}
        shell: pwsh
        run: |
          $Dist = Join-Path $env:GITHUB_WORKSPACE 'dist\LabGym'
          $SetupScript = Join-Path $env:GITHUB_WORKSPACE 'LabGym\pyinstaller\setup.iss'
          
          Write-Host "Checking paths:"
          Write-Host "  Dist: $Dist"
          Write-Host "  Setup Script: $SetupScript"
          Write-Host "  Dist exists: $(Test-Path $Dist)"
          Write-Host "  Setup script exists: $(Test-Path $SetupScript)"
          
          if (!(Test-Path $Dist)) { Write-Error "Expected $Dist to exist after PyInstaller build"; exit 1 }
          if (!(Test-Path $SetupScript)) { Write-Error "Expected $SetupScript to exist"; exit 1 }
          
          # Show contents of dist directory
          Write-Host "Contents of dist directory:"
          Get-ChildItem -Path $Dist -Recurse | Select-Object Name, FullName | Format-Table
          
          # Pass AppDist to the preprocessor so relative paths are not an issue
          iscc "/DAppDist=$Dist" "$SetupScript"


      - name: Upload Windows artifacts
        if: ${{ matrix.target == 'windows' }}
        uses: actions/upload-artifact@v4
        with:
          name: LabGym-Windows-x64-${{ github.run_number }}
          path: |
            dist/installer/LabGym-Installer-x64.exe
            dist/LabGym
