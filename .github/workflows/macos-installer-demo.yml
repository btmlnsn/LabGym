# .github/workflows/build-macos-installer.yml
jobs:
  build-arm64:
    runs-on: macos-14
    env:
      PYTHON_VERSION: "3.10"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          # Keep PyInstaller 6.10 as you pinned; add hooks-contrib explicitly
          pip install -r docs/requirements-build.txt
          pip install pyinstaller-hooks-contrib

      - name: Build LabGym.app via spec
        run: |
          pyinstaller --clean --noconfirm LabGym/pyinstaller/labgym.spec

      # --- 4) Minimal CI proof that source files are on disk ---
      - name: Verify detectron2 sources shipped as .py
        run: |
          APP_RES="dist/LabGym.app/Contents/Resources"
          test -f "$APP_RES/LabGym/detectron2/modeling/box_regression.py"
          echo "Found: $APP_RES/LabGym/detectron2/modeling/box_regression.py"
          # Optional: show which loader will be used if imported at runtime
          python - <<'PY'
import importlib, inspect, sys, os
# Simulate the runtime hook logic so we know import will hit the on-disk copy
res = "dist/LabGym.app/Contents/Resources"
sys.path.insert(0, os.path.abspath(res))  # parent of LabGym
m = importlib.import_module("LabGym.detectron2.modeling.box_regression")
print("Module __file__ =", m.__file__)
print("Has source?     =", bool(inspect.getsource(m.Box2BoxTransform)))
PY

      - name: Create DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "LabGym Installer" \
            --background "LabGym/pyinstaller/dmg-background.png" \
            --window-size 600 400 \
            --icon-size 96 \
            --app-drop-link 450 200 \
            "dist/LabGym-Installer.dmg" "dist/LabGym.app"
