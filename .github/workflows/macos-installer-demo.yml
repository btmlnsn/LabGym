# .github/workflows/build-macos-installer.yml
name: installer-builder

on:
  push:
    branches: [ ci/pyinstaller-demo ]
  workflow_dispatch:


jobs:
  build-arm64:
    runs-on: macos-14
    env:
      PYTHON_VERSION: "3.10"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Clean dist/build
        run: |
          rm -rf dist build

  
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          # Keep PyInstaller 6.10 as you pinned; add hooks-contrib explicitly
          pip install -r docs/requirements-build.txt
          pip install pyinstaller-hooks-contrib

      - name: Build LabGym.app via spec
        working-directory: ${{ github.workspace }}
        run: |
          pyinstaller --clean --noconfirm LabGym/pyinstaller/labgym.spec

      # --- 4) Minimal CI proof that source files are on disk ---
      - name: Verify vendored detectron2 sources and inspect()
        shell: bash
        run: |
          set -euo pipefail
          APP="${GITHUB_WORKSPACE}/dist/LabGym.app"
          SIDECAR="${GITHUB_WORKSPACE}/dist/LabGym_sidecar"

          echo "== dist listing =="
          ls -la "${GITHUB_WORKSPACE}/dist" || true
          [ -d "${SIDECAR}" ] || { echo "Missing sidecar at ${SIDECAR}"; exit 1; }

          # Try both candidate layouts for the on-disk sources.
          CAND1="${SIDECAR}/LabGym/detectron2/modeling/box_regression.py"
          CAND2="${SIDECAR}/_internal/LabGym/detectron2/modeling/box_regression.py"

          if [ -f "$CAND1" ]; then
            echo "Found source at: $CAND1"
          elif [ -f "$CAND2" ]; then
            echo "Found source at: $CAND2"
          else
            echo "Neither ${CAND1} nor ${CAND2} found; dumping short trees:"
            echo "-- sidecar (top) --"; find "${SIDECAR}" -maxdepth 2 -print | sed 's|^|SIDECAR: |'
            echo "-- sidecar/LabGym --"; [ -d "${SIDECAR}/LabGym" ] && find "${SIDECAR}/LabGym" -maxdepth 3 -print | sed 's|^|SIDECAR: |' || true
            echo "-- sidecar/_internal/LabGym --"; [ -d "${SIDECAR}/_internal/LabGym" ] && find "${SIDECAR}/_internal/LabGym" -maxdepth 3 -print | sed 's|^|SIDECAR: |' || true
            # Don't fail yet—try importing to let the runtime hook/path logic prove itself.
          fi

          "${{ env.pythonLocation }}/python" - <<'PY'
          import os, sys, importlib, inspect, pprint

          # Prefer sidecar; try both layouts. Also keep .app fallbacks just in case.
          bases = [
            os.path.abspath("dist/LabGym_sidecar"),
            os.path.abspath("dist/LabGym_sidecar/_internal"),
            os.path.abspath("dist/LabGym.app/Contents/Resources"),
            os.path.abspath("dist/LabGym.app/Contents/MacOS"),
          ]
          for base in bases:
              labgym = os.path.join(base, "LabGym")
              if os.path.isdir(labgym):
                  sys.path.insert(0, base)

          print("sys.path head:")
          pprint.pprint(sys.path[:6])

          try:
              m = importlib.import_module("LabGym.detectron2.modeling.box_regression")
              print("Imported:", m.__name__)
              print("Loaded from:", getattr(m, "__file__", "<no __file__>"))
              print("Box2BoxTransform LOC:", len(inspect.getsource(m.Box2BoxTransform).splitlines()))
          except Exception as e:
              print("IMPORT FAILED:", e)
              # Make CI fail here so we see the traceback.
              raise
          PY


      - name: Create DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "LabGym Installer" \
            --background "LabGym/pyinstaller/dmg-background.png" \
            --window-size 600 400 \
            --icon-size 96 \
            --app-drop-link 450 200 \
            "dist/LabGym-Installer.dmg" "dist/LabGym.app"
