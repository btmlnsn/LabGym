# .github/workflows/build-macos-installer.yml
name: installer-builder

on:
  push:
    branches: [ ci/pyinstaller-demo ]
  workflow_dispatch:


jobs:
  build-arm64:
    runs-on: macos-14
    env:
      PYTHON_VERSION: "3.10"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Clean dist/build
        run: |
          rm -rf dist build

  
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          # Keep PyInstaller 6.10 as you pinned; add hooks-contrib explicitly
          pip install -r docs/requirements-build.txt
          pip install pyinstaller-hooks-contrib

      - name: Build LabGym.app via spec
        working-directory: ${{ github.workspace }}
        run: |
          pyinstaller --clean --noconfirm LabGym/pyinstaller/labgym.spec

      # --- 4) Minimal CI proof that source files are on disk ---
      - name: Verify vendored detectron2 sources and inspect()
        shell: bash
        run: |
          set -euo pipefail
          APP="${GITHUB_WORKSPACE}/dist/LabGym.app"
          SIDECAR="${GITHUB_WORKSPACE}/dist/LabGym_sidecar"
          SIDECAR_INTERNAL="${SIDECAR}/_internal"

          echo "== dist listing =="
          ls -la "${GITHUB_WORKSPACE}/dist" || true

          if [ ! -d "${SIDECAR}" ]; then
            echo "Expected sidecar dir at ${SIDECAR}"; exit 1
          fi

          # Check all plausible locations, prefer _internal (PyInstaller 6.10 one-dir layout)
          targets=(
            "${SIDECAR_INTERNAL}/LabGym/detectron2/modeling/box_regression.py"
            "${SIDECAR}/LabGym/detectron2/modeling/box_regression.py"
            "${APP}/Contents/Resources/LabGym/detectron2/modeling/box_regression.py"
            "${APP}/Contents/MacOS/LabGym/detectron2/modeling/box_regression.py"
          )

          found=""
          for t in "${targets[@]}"; do
            if [ -f "$t" ]; then found="$t"; break; fi
          done

          if [ -z "$found" ]; then
            echo "Missing box_regression.py in expected locations. Trees for debugging:"
            echo "-- Sidecar (_internal) --"; find "${SIDECAR_INTERNAL}" -maxdepth 6 -print || true
            echo "-- Sidecar (root) --"; find "${SIDECAR}" -maxdepth 3 -print || true
            echo "-- .app Resources --"; find "${APP}/Contents/Resources" -maxdepth 4 -print || true
            echo "-- .app MacOS --"; find "${APP}/Contents/MacOS" -maxdepth 3 -print || true
            exit 1
          fi
          echo "Found: $found"

          /usr/bin/python3 - <<'PY'
          import sys, os, importlib, inspect
          cands = [
              os.path.abspath("dist/LabGym_sidecar/_internal"),  # preferred (PyInstaller 6.10)
              os.path.abspath("dist/LabGym_sidecar"),            # fallback
              os.path.abspath("dist/LabGym.app/Contents/Resources"),
              os.path.abspath("dist/LabGym.app/Contents/MacOS"),
          ]
          for base in cands:
              labgym = os.path.join(base, "LabGym")
              if os.path.isdir(labgym):
                  sys.path.insert(0, base)
          m = importlib.import_module("LabGym.detectron2.modeling.box_regression")
          print("Loaded from:", m.__file__)
          print("Box2BoxTransform source lines:", len(inspect.getsource(m.Box2BoxTransform).splitlines()))
          PY


      - name: Create DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "LabGym Installer" \
            --background "LabGym/pyinstaller/dmg-background.png" \
            --window-size 600 400 \
            --icon-size 96 \
            --app-drop-link 450 200 \
            "dist/LabGym-Installer.dmg" "dist/LabGym.app"
