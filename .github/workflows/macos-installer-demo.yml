# .github/workflows/build-macos-installer.yml
name: installer-builder

on:
  push:
    branches: [ ci/pyinstaller-demo ]
  workflow_dispatch:


jobs:
  build-arm64:
    runs-on: macos-14
    env:
      PYTHON_VERSION: "3.10"
    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}


      - name: Clean dist/build
        run: |
          rm -rf dist build

  
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          # Keep PyInstaller 6.10 as you pinned; add hooks-contrib explicitly
          pip install -r docs/requirements-build.txt
          pip install pyinstaller-hooks-contrib
          # install the project (PEP 517 via pdm-backend) to upll in runtime deps
          pip install -e .


      - name: Build LabGym.app via spec
        working-directory: ${{ github.workspace }}
        run: |
          pyinstaller --clean --noconfirm LabGym/pyinstaller/labgym.spec


      # --- 4) Minimal CI proof that source files are on disk ---
      - name: Verify vendored detectron2 sources and inspect()
        shell: bash
        env: 
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          SIDECAR="${GITHUB_WORKSPACE}/dist/LabGym_sidecar"

          echo "== dist listing =="
          ls -la "${GITHUB_WORKSPACE}/dist" || true

          if [ ! -d "${SIDECAR}" ]; then
            echo "Expected sidecar dir at ${SIDECAR}"; exit 1
          fi

          # Prefer _internal layout if present
          if [ -d "${SIDECAR}/_internal" ]; then
            BASE="${SIDECAR}/_internal"
          else
            BASE="${SIDECAR}"
          fi

          TARGET="${BASE}/LabGym/detectron2/modeling/box_regression.py"
          if [ ! -f "$TARGET" ]; then
            echo "Missing ${TARGET}; showing tree for debug:"
            find "${SIDECAR}" -maxdepth 6 -print | sed 's|^|SIDECAR: |'
            exit 1
          fi
          echo "Found: $TARGET"


          echo "== Ensure there are NO duplicated file.py/file.py directories =="
          if find "${SIDECAR}" -type d -path '*/*.py/*' -print -quit | grep -q . ; then
            echo "Found duplicated 'file.py/file.py' style directories:"
            find "${SIDECAR}" -type d -path '*/*.py/*'
            exit 1
          else
            echo "No duplicated 'file.py/file.py' directories detected."
          fi

          echo "== Spot-check a few other files exist exactly once =="
          for P in \
            "${BASE}/LabGym/detectron2/checkpoint/catalog.py" \
            "${BASE}/LabGym/detectron2/engine/hooks.py"
          do
            if [ ! -f "$P" ]; then
              echo "Missing expected file: $P"
              exit 1
            fi
            echo "OK: $P"
          done


          "${{ env.pythonLocation }}/python" - <<'PY'
          import os, ast
          base_candidates = [
            os.path.abspath("dist/LabGym_sidecar/_internal/LabGym/detectron2/modeling/box_regression.py"),
            os.path.abspath("dist/LabGym_sidecar/LabGym/detectron2/modeling/box_regression.py"),
          ]
          target = next((p for p in base_candidates if os.path.isfile(p)), None)
          if not target:
            raise SystemExit("box_regression.py not found in expected sidecar locations")
          with open(target, "r", encoding="utf-8") as f:
            src = f.read()
          tree = ast.parse(src, filename=target)
          names = {n.name for n in ast.walk(tree) if isinstance(n, ast.ClassDef)}
          print("Parsed:", target)
          if "Box2BoxTransform" not in names:
            raise SystemExit("Box2BoxTransform class not found in box_regression.py")
          print("Found class: Box2BoxTransform")
          PY


      - name: Bundle sidecar into .app (Resources)
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/LabGym.app"
          SIDECAR="dist/LabGym_sidecar"
          DEST="${APP}/Contents/Resources/LabGym_sidecar"

          if [[ ! -d "$SIDECAR" ]]; then
            echo "Expected ${SIDECAR} to exist"; exit 1
          fi

          rm -rf "$DEST"
          mkdir -p "$(dirname "$DEST")"
          mv "$SIDECAR" "$DEST"

          echo "Sidecar moved into: $DEST"

          # optional sanity peek
          find "$DEST" -maxdepth 3 -type f -name "box_regression.py" -print || true


      - name: Create DMG
        shell: bash
        run: |
          set -euo pipefail
          brew install create-dmg

          # fresh staging dir
          rm -rf dist/InstallerRoot
          mkdir -p dist/InstallerRoot

          # stage only the app (sidecar now lives inside Contents/Resources)
          cp -R dist/LabGym.app dist/InstallerRoot/

          # optional background args
          declare -a BG_ARGS=()
          if [[ -n "${DMG_BG_IMAGE:-}" ]]; then
            BG_ARGS+=(--background "$DMG_BG_IMAGE")
          fi
          if [[ -n "${DMG_BG_COLOR:-}" ]]; then
            BG_ARGS+=(--background-color "$DMG_BG_COLOR")
          fi

          rm -f "dist/LabGym-Installer.dmg"

          create-dmg \
            --volname "LabGym Installer" \
            --window-size 800 540 \
            --icon-size 96 \
            --app-drop-link 650 380 \
            --icon "LabGym.app" 150 380 \
            ${BG_ARGS+"${BG_ARGS[@]}"} \
            "dist/LabGym-Installer.dmg" \
            "dist/InstallerRoot"


      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: LabGym-Installer-macOS-arm64-${{ github.run_number }}
          path: dist/LabGym-Installer.dmg
          if-no-files-found: error
          retention-days: 14


      - name: Zip .app for artifact upload
        run: |
          cd dist && zip -r LabGym.app.zip LabGym.app
      
      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with: 
          name: LabGym.app-macOS-arm64-${{ github.run_number }}
          path: dist/LabGym.app.zip
          if-no-files-found: error
          retention-days: 14

