# .github/workflows/build-macos-installer.yml
name: installer-builder

on:
  push:
    branches: [ ci/pyinstaller-demo ]
  workflow_dispatch:


jobs:
  build-arm64:
    runs-on: macos-14
    env:
      PYTHON_VERSION: "3.10"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          # Keep PyInstaller 6.10 as you pinned; add hooks-contrib explicitly
          pip install -r docs/requirements-build.txt
          pip install pyinstaller-hooks-contrib

      - name: Build LabGym.app via spec
        working-directory: ${{ github.workspace }}
        run: |
          pyinstaller --clean --noconfirm LabGym/pyinstaller/labgym.spec

      # --- 4) Minimal CI proof that source files are on disk ---
      - name: Verify vendored detectron2 sources and inspect()
        shell: bash
        run: |
          set -euo pipefail
          APP="${GITHUB_WORKSPACE}/dist/LabGym.app"
          SIDECAR="${GITHUB_WORKSPACE}/dist/LabGym"

          echo "== Top-level dist listing =="
          ls -la "${GITHUB_WORKSPACE}/dist" || true

          found=""
          path1="${APP}/Contents/MacOS/LabGym/detectron2/modeling/box_regression.py"
          path2="${APP}/Contents/Resources/LabGym/detectron2/modeling/box_regression.py"
          path3="${SIDECAR}/LabGym/detectron2/modeling/box_regression.py"

          for p in "$path1" "$path2" "$path3"; do
            if [ -f "$p" ]; then
              echo "Found: $p"
              found="$p"
              break
            fi
          done

          if [ -z "$found" ]; then
            echo "box_regression.py not found in expected locations. Tree for debugging:"
            find "${APP}/Contents" -maxdepth 6 -type f -name 'box_regression.py' -print || true
            find "${SIDECAR}" -maxdepth 6 -type f -name 'box_regression.py' -print || true
            exit 1
          fi

          echo "== Smoke test: import + inspect (mimics TorchScript need) =="
          /usr/bin/python3 - <<'PY'
          import sys, os, importlib, inspect
          base_candidates = [
            os.path.abspath("dist/LabGym.app/Contents/MacOS"),
            os.path.abspath("dist/LabGym.app/Contents/Resources"),
            os.path.abspath("dist/LabGym"),
          ]
          for base in base_candidates:
              labgym = os.path.join(base, "LabGym")
              if os.path.isdir(labgym):
                  sys.path.insert(0, base)
          try:
              m = importlib.import_module("LabGym.detectron2.modeling.box_regression")
              print("Loaded from:", m.__file__)
              src = inspect.getsource(m.Box2BoxTransform)
              print("Source length:", len(src.splitlines()))
          except Exception as e:
              raise SystemExit(f"Import/inspect failed: {e}")
          PY

      - name: Create DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "LabGym Installer" \
            --background "LabGym/pyinstaller/dmg-background.png" \
            --window-size 600 400 \
            --icon-size 96 \
            --app-drop-link 450 200 \
            "dist/LabGym-Installer.dmg" "dist/LabGym.app"
