# .github/workflows/build-macos-installer.yml
name: installer-builder

on:
  push:
    branches: [ ci/pyinstaller-demo ]
  workflow_dispatch:


jobs:
  build-arm64:
    runs-on: macos-14
    env:
      PYTHON_VERSION: "3.10"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          # Keep PyInstaller 6.10 as you pinned; add hooks-contrib explicitly
          pip install -r docs/requirements-build.txt
          pip install pyinstaller-hooks-contrib

      - name: Build LabGym.app via spec
        working-directory: ${{ github.workspace }}
        run: |
          pyinstaller --clean --noconfirm LabGym/pyinstaller/labgym.spec

      # --- 4) Minimal CI proof that source files are on disk ---
      - name: Verify detectron2 sources shipped as .py
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          APP_MACOS="dist/LabGym.app/Contents/MacOS"

          echo "Contents under $APP_MACOS (top-level):"
          ls -la "$APP_MACOS" || true

          echo "Looking for box_regression.py under MacOS/LabGym/detectron2/..."
          if [ ! -f "$APP_MACOS/LabGym/detectron2/modeling/box_regression.py" ]; then
            echo "Did not find expected file; showing a shallow tree to help debug:"
            find "$APP_MACOS" -maxdepth 5 -type f -name 'box_regression.py' -print || true
            find "$APP_MACOS" -maxdepth 3 -type d -print | sed 's|^|DIR: |'
            exit 1
          fi

          echo "Found: $APP_MACOS/LabGym/detectron2/modeling/box_regression.py"

          echo "Smoke test: import module from on-disk bundle and inspect source..."
          /usr/bin/python3 - <<'PY'
          import sys, os, importlib, inspect
          macos = os.path.abspath("dist/LabGym.app/Contents/MacOS")
          sys.path.insert(0, macos)  # make MacOS/LabGym importable
          m = importlib.import_module("LabGym.detectron2.modeling.box_regression")
          print("Loaded from:", m.__file__)
          print("Source lines on Box2BoxTransform:", len(inspect.getsource(m.Box2BoxTransform).splitlines()))
          PY

      - name: Create DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "LabGym Installer" \
            --background "LabGym/pyinstaller/dmg-background.png" \
            --window-size 600 400 \
            --icon-size 96 \
            --app-drop-link 450 200 \
            "dist/LabGym-Installer.dmg" "dist/LabGym.app"
