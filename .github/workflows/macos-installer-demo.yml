name: Build macOS Installer (PyInstaller Demo)

on:
  push:
    branches: [ ci/pyinstaller-demo ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64:
    name: ARM64 .app + DMG (GitHub-hosted)
    runs-on: macos-14
    env:
      PYTHON_VERSION: "3.10"
      APP_NAME: "LabGym"
      DMG_OUTDIR: "out"
      SPEC_PATH: "LabGym/pyinstaller/labgym.spec"
      ICON_BG_PNG: "LabGym/assets/icons/labgym.png"   # used if present for DMG bg
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10 (latest available)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: pip-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements.txt', 'docs/requirements-build.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ env.PYTHON_VERSION }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -r docs/requirements-build.txt
          # also install Homebrew create-dmg for the well-known CLI (safe if already present)
          brew install create-dmg || true

      - name: Build .app with PyInstaller
        run: |
          pyinstaller --clean --noconfirm "${SPEC_PATH}"
          echo "Contents of dist/:"
          ls -al dist

      - name: Package to DMG
          run: |
            mkdir -p "${DMG_OUTDIR}"
            DMG="${DMG_OUTDIR}/${APP_NAME}-macOS-arm64.dmg"
            APP_PATH="dist/${APP_NAME}.app"

            if [ -f "${ICON_BG_PNG}" ]; then
              create-dmg \
                --volname "${APP_NAME}" \
                --window-size 540 380 \
                --background "${ICON_BG_PNG}" \
                --icon "${APP_NAME}.app" 140 170 \
                --app-drop-link 400 170 \
                "${DMG}" \
                "${APP_PATH}"
            else
              create-dmg \
                --volname "${APP_NAME}" \
                --window-size 540 380 \
                --icon "${APP_NAME}.app" 140 170 \
                --app-drop-link 400 170 \
                "${DMG}" \
                "${APP_PATH}"
            fi

            echo "DMG created at ${DMG}"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: LabGym-macOS-arm64
          path: out/LabGym-macOS-arm64.dmg
          if-no-files-found: error